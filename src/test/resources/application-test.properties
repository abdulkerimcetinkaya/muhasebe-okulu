# Test Environment Configuration

# H2 In-Memory Database for Testing
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate Configuration for Tests
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable Flyway in tests (use Hibernate DDL instead)
spring.flyway.enabled=false

# JWT Configuration (test keys)
jwt.secret=testSecretKeyForJunitTestsOnly123456789012345678901234567890
jwt.expiration=3600000

# Disable Actuator for tests
management.endpoints.enabled-by-default=false

# Logging Configuration
logging.level.org.springframework=ERROR
logging.level.org.hibernate=ERROR
logging.level.com.example.muhasebeokulu5=DEBUG

# Disable banner for cleaner test output
spring.main.banner-mode=off

# Test specific settings
spring.jpa.properties.hibernate.generate_statistics=false

# Disable DatabaseConstraintUpdater in tests
database.constraint.updater.enabled=false
