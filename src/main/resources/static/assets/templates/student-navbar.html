<!-- STANDARD STUDENT NAVBAR TEMPLATE -->
<!-- Bu şablon tüm öğrenci sayfalarında (dashboard, problems, quizzes, profile vb.) kullanılmalıdır -->

<header class="sticky top-0 z-40 w-full backdrop-blur-sm">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16 border-b border-slate-200/80">

            <!-- Logo + Navigation Links (Ortalanmış) -->
            <div class="flex items-center justify-between w-full">
                <!-- Logo -->
                <a href="index.html" class="flex items-center gap-2 group">
                    <div class="w-8 h-8 bg-slate-800 text-white flex items-center justify-center rounded-lg font-semibold text-lg tracking-tighter transition-transform duration-300 group-hover:scale-105">MO</div>
                    <span class="text-lg font-semibold tracking-tight text-slate-900">MuhasebeOkulu</span>
                </a>

                <!-- Navigation Links (Ortalanmış - sadece giriş yapan kullanıcılar için) -->
                <nav id="userNavLinks" class="hidden md:flex items-center justify-center gap-6 absolute left-1/2 transform -translate-x-1/2">
                    <a href="dashboard.html" id="navDashboard" class="text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors">Dashboard</a>
                    <a href="problems.html" id="navProblems" class="text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors">Problemler</a>
                    <a href="quizzes.html" id="navQuizzes" class="text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors">Quizler</a>
                    <a href="profile.html" id="navProfile" class="text-sm font-medium text-slate-600 hover:text-slate-900 transition-colors">Profilim</a>
                </nav>
            </div>

            <!-- Auth Buttons / Profile Menu -->
            <div class="flex items-center gap-2">
                <!-- Giriş Yapmamış Kullanıcılar İçin -->
                <div id="authButtonsGuest" class="flex items-center gap-2">
                    <a href="login.html" class="inline-flex items-center justify-center px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 rounded-md transition-colors whitespace-nowrap">Giriş Yap</a>
                    <a href="register.html" class="inline-flex items-center justify-center px-3 py-2 text-sm font-medium text-white bg-slate-800 hover:bg-slate-700 rounded-md transition-colors shadow-sm whitespace-nowrap">Kayıt Ol</a>
                </div>

                <!-- Giriş Yapmış Kullanıcılar İçin -->
                <div id="authButtonsUser" class="hidden relative">
                    <button onclick="CommonUtils.toggleUserDropdown()" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 rounded-lg transition-colors">
                        <i data-lucide="user" class="w-4 h-4"></i>
                        <span id="userDisplayName">Hoşgeldin, Kullanıcı</span>
                        <i data-lucide="chevron-down" class="w-4 h-4"></i>
                    </button>

                    <!-- Dropdown Menu -->
                    <div id="userDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-slate-200 py-1">
                        <a href="profile.html" class="flex items-center gap-2 px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 transition-colors">
                            <i data-lucide="user" class="w-4 h-4"></i>
                            Profilim
                        </a>
                        <hr class="my-1 border-slate-200">
                        <button onclick="CommonUtils.logout()" class="w-full flex items-center gap-2 px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
                            <i data-lucide="log-out" class="w-4 h-4"></i>
                            Çıkış Yap
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<script>
// NAVBAR INITIALIZATION - Bu scripti her sayfanın DOMContentLoaded event'inde çağırın
function initStudentNavbar() {
    // Aktif sayfa linkini vurgula
    const currentPage = window.location.pathname.split('/').pop() || 'index.html';
    const navLinks = {
        'dashboard.html': 'navDashboard',
        'problems.html': 'navProblems',
        'quizzes.html': 'navQuizzes',
        'profile.html': 'navProfile',
        'problem-detail.html': 'navProblems',
        'quiz-detail.html': 'navQuizzes'
    };

    const activeLinkId = navLinks[currentPage];
    if (activeLinkId) {
        const activeLink = document.getElementById(activeLinkId);
        if (activeLink) {
            activeLink.classList.remove('text-slate-600');
            activeLink.classList.add('text-slate-900');
        }
    }

    // Auth durumunu kontrol et
    const token = localStorage.getItem('token');
    if (token) {
        // Kullanıcı giriş yapmış
        document.getElementById('authButtonsGuest').classList.add('hidden');
        document.getElementById('authButtonsUser').classList.remove('hidden');
        document.getElementById('userNavLinks').classList.remove('hidden');

        // Profil menüsünü güncelle
        CommonUtils.updateProfileMenu();
    } else {
        // Kullanıcı giriş yapmamış
        document.getElementById('authButtonsGuest').classList.remove('hidden');
        document.getElementById('authButtonsUser').classList.add('hidden');
        document.getElementById('userNavLinks').classList.add('hidden');
    }

    // Dropdown için click outside listener artık common.js'de global olarak tanımlı

    // Lucide icons'ı yenile
    if (window.lucide) {
        lucide.createIcons();
    }
}

// Otomatik çağrı - eğer sayfa yüklendiyse
if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initStudentNavbar);
} else {
    initStudentNavbar();
}
</script>
