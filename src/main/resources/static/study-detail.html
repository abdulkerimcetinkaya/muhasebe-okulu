<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğrenme Kartı - MuhasebeOkulu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Ortak CSS -->
    <link rel="stylesheet" href="http://localhost:8080/assets/css/common.css">
    <link rel="stylesheet" href="http://localhost:8080/assets/css/components.css">

    <!-- Ortak JS -->
    <script src="http://localhost:8080/assets/js/common.js"></script>
    <script src="http://localhost:8080/assets/js/api.js"></script>
    <script src="http://localhost:8080/assets/js/auth.js"></script>

    <!-- Page-specific JS -->
    <script src="http://localhost:8080/assets/js/pages/study-detail.js"></script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            overflow: hidden;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }

        .custom-scrollbar::-webkit-scrollbar-track {
            background-color: #f8fafc;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1;
            border-radius: 3px;
        }

        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: #94a3b8;
        }

        .section-item {
            transition: all 0.2s ease;
        }

        .section-item:hover {
            background-color: #f8fafc;
        }

        .section-item.active {
            background-color: #f1f5f9;
            border-left: 3px solid #1e293b;
        }

        .content-area {
            line-height: 1.8;
        }

        .content-area h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-top: 1.5rem;
            margin-bottom: 1rem;
            color: #0f172a;
        }

        .content-area h3 {
            font-size: 1.25rem;
            font-weight: 600;
            margin-top: 1.25rem;
            margin-bottom: 0.75rem;
            color: #1e293b;
        }

        .content-area p {
            margin-bottom: 1rem;
            color: #334155;
        }

        .content-area ul,
        .content-area ol {
            margin-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .content-area li {
            margin-bottom: 0.5rem;
            color: #475569;
        }

        .content-area strong {
            font-weight: 600;
            color: #0f172a;
        }

        .problem-card,
        .quiz-card {
            transition: all 0.2s ease;
        }

        .problem-card:hover,
        .quiz-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-800 antialiased">
    <div class="flex flex-col h-screen">
        <!-- Header -->
        <header class="sticky top-0 z-40 w-full bg-white/80 backdrop-blur-sm border-b border-slate-200/80 flex-shrink-0">
            <div class="max-w-full mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex items-center justify-between h-16">
                    <!-- Giriş yapmamış kullanıcılar için: Geri butonu + Logo + Breadcrumb -->
                    <div id="guestLayout" class="flex items-center gap-4">
                        <button onclick="goBack()" class="flex items-center gap-2 text-slate-600 hover:text-slate-800 transition-colors">
                            <i data-lucide="arrow-left" class="w-5 h-5" style="stroke-width: 1.5;"></i>
                            <span class="hidden sm:inline text-sm font-medium">Geri</span>
                        </button>
                        <a href="index.html" class="flex items-center gap-2 group">
                            <div class="w-8 h-8 bg-slate-800 text-white flex items-center justify-center rounded-lg font-semibold text-lg tracking-tighter transition-transform duration-300 group-hover:scale-105">MO</div>
                            <span class="hidden sm:inline text-lg font-semibold tracking-tight text-slate-900">MuhasebeOkulu</span>
                        </a>
                        <div class="hidden md:flex items-center gap-2 text-sm text-slate-500">
                            <a href="study.html" class="hover:text-slate-900">Öğren</a>
                            <i data-lucide="chevron-right" class="w-4 h-4"></i>
                            <span class="font-medium text-slate-800" id="breadcrumbTitle">Kart</span>
                        </div>
                    </div>

                    <!-- Giriş yapmış kullanıcılar için: Geri butonu + Logo + Breadcrumb -->
                    <div id="userLayout" class="hidden flex items-center gap-4">
                        <button onclick="goBack()" class="flex items-center gap-2 text-slate-600 hover:text-slate-800 transition-colors">
                            <i data-lucide="arrow-left" class="w-5 h-5" style="stroke-width: 1.5;"></i>
                            <span class="hidden sm:inline text-sm font-medium">Geri</span>
                        </button>
                        <a href="index.html" class="flex items-center gap-2 group">
                            <div class="w-8 h-8 bg-slate-800 text-white flex items-center justify-center rounded-lg font-semibold text-lg tracking-tighter transition-transform duration-300 group-hover:scale-105">MO</div>
                            <span class="hidden sm:inline text-lg font-semibold tracking-tight text-slate-900">MuhasebeOkulu</span>
                        </a>
                        <div class="hidden md:flex items-center gap-2 text-sm text-slate-500">
                            <a href="study.html" class="hover:text-slate-900">Öğren</a>
                            <i data-lucide="chevron-right" class="w-4 h-4"></i>
                            <span class="font-medium text-slate-800" id="breadcrumbTitleAuth">Kart</span>
                        </div>
                    </div>

                    <!-- Giriş yapmamış kullanıcılar için: Auth Butonları -->
                    <div id="guestAuthButtons" class="flex items-center gap-2 flex-shrink-0">
                        <a href="login.html" class="inline-flex items-center justify-center px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 rounded-md transition-colors whitespace-nowrap">Giriş Yap</a>
                        <a href="register.html" class="inline-flex items-center justify-center px-3 py-2 text-sm font-medium text-white bg-slate-800 hover:bg-slate-700 rounded-md transition-colors shadow-sm whitespace-nowrap">Kayıt Ol</a>
                    </div>

                    <!-- Giriş yapmış kullanıcılar için: Profil Dropdown -->
                    <div id="userProfileMenu" class="hidden flex items-center gap-2">
                        <div class="relative">
                            <button onclick="CommonUtils.toggleUserDropdown()" class="flex items-center gap-2 px-3 py-2 text-sm font-medium text-slate-700 hover:bg-slate-100 rounded-lg transition-colors">
                                <i data-lucide="user" class="w-4 h-4"></i>
                                <span id="userDisplayName">Hoşgeldin, Kullanıcı</span>
                                <i data-lucide="chevron-down" class="w-4 h-4"></i>
                            </button>
                            <div id="userDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg border border-slate-200 py-1">
                                <a href="profile.html" class="flex items-center gap-2 px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 transition-colors">
                                    <i data-lucide="user" class="w-4 h-4"></i>
                                    Profilim
                                </a>
                                <hr class="my-1 border-slate-200">
                                <button onclick="CommonUtils.logout()" class="w-full flex items-center gap-2 px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
                                    <i data-lucide="log-out" class="w-4 h-4"></i>
                                    Çıkış Yap
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content: Master-Detail Layout -->
        <main class="flex-grow flex flex-row overflow-hidden">
            <!-- Left Panel: Section List (Master) -->
            <div class="w-full lg:w-1/3 xl:w-1/4 bg-white border-r border-slate-200 overflow-y-auto custom-scrollbar">
                <div class="p-6">
                    <div class="mb-6">
                        <h2 id="cardTitle" class="text-xl font-semibold text-slate-900 mb-2">Kart Başlığı</h2>
                        <p id="cardDescription" class="text-sm text-slate-600">Açıklama</p>
                    </div>
                    <div id="sectionsList" class="space-y-2">
                        <!-- Sections will be loaded here -->
                    </div>
                </div>
            </div>

            <!-- Right Panel: Section Content (Detail) -->
            <div class="flex-1 overflow-y-auto custom-scrollbar bg-slate-50">
                <div class="max-w-4xl mx-auto p-6">
                    <!-- Loading State -->
                    <div id="loadingContent" class="flex items-center justify-center py-12">
                        <div class="flex items-center gap-2 text-slate-600">
                            <i data-lucide="loader-2" class="w-5 h-5 animate-spin"></i>
                            <span>İçerik yükleniyor...</span>
                        </div>
                    </div>

                    <!-- Content Area -->
                    <div id="contentArea" class="hidden">
                        <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-8">
                            <h1 id="sectionTitle" class="text-2xl font-bold text-slate-900 mb-6">Bölüm Başlığı</h1>
                            <div id="sectionContent" class="content-area">
                                <!-- Dynamic content will be loaded here -->
                            </div>
                        </div>
                    </div>

                    <!-- Empty State -->
                    <div id="emptyContent" class="hidden text-center py-12">
                        <div class="inline-flex items-center justify-center w-16 h-16 bg-slate-100 rounded-full mb-4">
                            <i data-lucide="file-text" class="w-8 h-8 text-slate-400"></i>
                        </div>
                        <h3 class="text-lg font-medium text-slate-900 mb-2">Bölüm seçin</h3>
                        <p class="text-slate-600">Soldan bir bölüm seçerek içeriği görüntüleyin</p>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // Initialize icons on load
        document.addEventListener('DOMContentLoaded', function() {
            lucide.createIcons();
        });
    </script>
</body>

</html>
