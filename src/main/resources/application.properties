spring.application.name=muhasebe-okulu-5

# ? PostgreSQL (Local) Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/muhasebe-okulu
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.driver-class-name=org.postgresql.Driver

# ? JPA/Hibernate Configuration
# UYARI: create modu tüm tabloları DROP edip yeniden oluşturur! Data kaybolur.
# İlk çalıştırmadan sonra mutlaka "update" moduna çevirin.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ? Performance Optimizations
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=100

# ? Connection Pool Optimization (HikariCP)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.connection-test-query=SELECT 1

# ? Static Resources Configuration
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.cache-public=false
spring.web.resources.add-mappings=true
spring.web.resources.cache.cachecontrol.no-cache=true

# ? MIME Type Configuration
spring.web.resources.media-types.svg=image/svg+xml
spring.web.resources.media-types.ico=image/x-icon
spring.web.resources.media-types.css=text/css
spring.web.resources.media-types.js=application/javascript
spring.web.resources.media-types.json=application/json
spring.web.resources.media-types.png=image/png
spring.web.resources.media-types.jpg=image/jpeg
spring.web.resources.media-types.jpeg=image/jpeg
spring.web.resources.media-types.gif=image/gif
spring.web.resources.media-types.woff=font/woff
spring.web.resources.media-types.woff2=font/woff2
spring.web.resources.media-types.ttf=font/ttf
spring.web.resources.media-types.eot=application/vnd.ms-fontobject

# ? JWT Configuration
jwt.secret=muhasebeOkulu2025SuperSecretKeyForJWTTokenGeneration123456789
jwt.expiration=86400000

# ? Actuator Configuration
management.endpoints.web.exposure.include=mappings,health,info
management.endpoint.mappings.enabled=true

# ? Debug Configuration
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.boot.autoconfigure=DEBUG
logging.level.com.example.muhasebeokulu5=DEBUG